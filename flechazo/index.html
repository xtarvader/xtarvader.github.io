<style>
  .steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .steps div { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; }
  .steps b { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; color: #fff; font: 1.3rem var(--display); margin-bottom: 10px; }
  .steps div:nth-child(1) b { background: var(--blue); box-shadow: inset 0 -4px 0 var(--blue-edge); }
  .steps div:nth-child(2) b { background: var(--mustard); box-shadow: inset 0 -4px 0 var(--mustard-edge); }
  .steps div:nth-child(3) b { background: var(--red); box-shadow: inset 0 -4px 0 var(--red-edge); }
  .steps h3 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 900; }
  .steps p { margin: 0; color: var(--ink-soft); }
  .shot-grid { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 260px)); }
  .shot-grid img { border-radius: 22px; border: 2px solid var(--line); box-shadow: 0 8px 0 var(--line); width: 100%; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
  .pills li { font-weight: 800; padding: 8px 14px; border-radius: 10px; background: var(--card); border: 2px solid var(--line); }
</style>
<script>
  var LANGS = ["en", "es", "fr", "de"];
  function pickLang() {
    var q = new URLSearchParams(location.search).get("lang");
    if (LANGS.indexOf(q) >= 0) return q;
    try { var saved = localStorage.getItem("lang"); if (LANGS.indexOf(saved) >= 0) return saved; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase().slice(0, 2);
    return LANGS.indexOf(nav) >= 0 ? nav : "en";
  }
  document.documentElement.lang = pickLang();
</script>
</head>

  <footer>&copy; 2026 L.M.F.P.</footer>

  var buttons = document.querySelectorAll("[data-set-lang]");
  function apply(lang) {

    document.documentElement.lang = lang;
    document.title = t.doc;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.dataset.i18n]; });

    buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.setLang === lang); });

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {

</script>
