<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flechazo: Arrow Jam Puzzle</title>
<meta name="description" content="Flechazo: free the arrows in the right order and match them in threes by colour before the tray fills up. Coming soon to Google Play.">
<meta property="og:title" content="Flechazo: Arrow Jam Puzzle">
<meta property="og:image" content="https://xtarvader.github.io/flechazo/hero.webp">
<meta name="theme-color" content="#F3ECDF">
<link rel="icon" type="image/webp" href="icon.webp">
<style>
  @font-face { font-family: "Lilita One"; src: url("../fonts/lilita-one.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Nunito"; src: url("../fonts/nunito.ttf") format("truetype"); font-weight: 200 1000; font-display: swap; }
  :root {
    --paper: #F3ECDF; --band: #E9DDC7; --card: #FFFAF1; --ink: #1D1B19; --ink-soft: #5E554B; --line: #D9CBB3;
    --red: #E0472F; --red-edge: #B0331E; --blue: #3F5DF5; --blue-edge: #2C45C4; --mustard: #E9A92E; --teal: #127A73;
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1B1815; --band: #231F1B; --card: #2A251F; --ink: #F3ECDF; --ink-soft: #BDB1A2; --line: #3D352C; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); }
  img { max-width: 100%; height: auto; display: block; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; flex-wrap: wrap; }
  .back { font-weight: 900; text-decoration: none; color: var(--ink); }
  .back:hover, .back:focus-visible { text-decoration: underline; text-decoration-color: var(--mustard); text-decoration-thickness: 3px; }
  .langs { display: flex; gap: 4px; }
  .langs button { font: 800 .8rem var(--body); padding: 7px 10px; border-radius: 10px; cursor: pointer; color: var(--ink); background: transparent; border: 2px solid var(--line); }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cover { border-radius: 24px; overflow: hidden; border: 2px solid var(--line); box-shadow: 0 8px 0 var(--line); background: #E4ECF6; }
  .head { display: flex; gap: 18px; align-items: flex-end; margin: -46px 0 0 20px; position: relative; }
  .head img { width: 112px; height: 112px; border-radius: 26px; border: 5px solid var(--paper); box-shadow: 0 6px 0 color-mix(in srgb, var(--ink) 18%, transparent); }
  h1 { font: clamp(2.2rem, 6vw, 3.4rem)/1 var(--display); margin: 0 0 6px; }
  .tag { margin: 0 0 6px; font-weight: 800; color: var(--ink-soft); }
  .status { display: inline-block; margin: 22px 0 10px; font-weight: 900; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); padding: 6px 12px; border-radius: 8px; }
  .lead { font-size: 1.12rem; max-width: 42rem; color: var(--ink-soft); }
  h2 { font: 2rem/1.1 var(--display); margin: 48px 0 18px; }
  .steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); counter-reset: s; }
  .steps div { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; }
  .steps b { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; color: #fff; font: 1.3rem var(--display); margin-bottom: 10px; }
  .steps div:nth-child(1) b { background: var(--blue); box-shadow: inset 0 -4px 0 var(--blue-edge); }
  .steps div:nth-child(2) b { background: var(--mustard); box-shadow: inset 0 -4px 0 #B9801A; }
  .steps div:nth-child(3) b { background: var(--red); box-shadow: inset 0 -4px 0 var(--red-edge); }
  .steps h3 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 900; }
  .steps p { margin: 0; color: var(--ink-soft); }
  .shots { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 260px)); justify-content: start; }
  .shots img { border-radius: 22px; border: 2px solid var(--line); box-shadow: 0 8px 0 var(--line); width: 100%; height: auto; }
  .features { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
  .features li { font-weight: 800; padding: 8px 14px; border-radius: 10px; background: var(--card); border: 2px solid var(--line); }
  footer { margin-top: 56px; border-top: 2px solid var(--line); padding: 22px 0 40px; color: var(--ink-soft); font-size: .92rem; display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--ink); font-weight: 800; }
</style>
<script>
  var LANGS = ["en", "es", "fr", "de"];
  function pickLang() {
    var q = new URLSearchParams(location.search).get("lang");
    if (LANGS.indexOf(q) >= 0) return q;
    try { var saved = localStorage.getItem("lang"); if (LANGS.indexOf(saved) >= 0) return saved; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase().slice(0, 2);
    return LANGS.indexOf(nav) >= 0 ? nav : "en";
  }
  document.documentElement.lang = pickLang();
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" id="back" href="../">← L.M.F.P.</a>
    <div class="langs">
      <button type="button" data-set-lang="es" lang="es" title="Español">ES</button>
      <button type="button" data-set-lang="en" lang="en" title="English">EN</button>
      <button type="button" data-set-lang="fr" lang="fr" title="Français">FR</button>
      <button type="button" data-set-lang="de" lang="de" title="Deutsch">DE</button>
    </div>
  </header>

  <div class="cover"><img src="hero.webp" width="1600" height="800" alt=""></div>
  <div class="head">
    <img src="icon.webp" width="112" height="112" alt="">
    <div>
      <h1>Flechazo</h1>
      <p class="tag" data-i18n="tag">Arrow Jam Puzzle</p>
    </div>
  </div>

  <span class="status" data-i18n="status">In development · closed test soon</span>
  <p class="lead" data-i18n="lead"></p>

  <h2 data-i18n="how_title">How to play</h2>
  <div class="steps">
    <div><b>1</b><h3 data-i18n="s1_t"></h3><p data-i18n="s1_p"></p></div>
    <div><b>2</b><h3 data-i18n="s2_t"></h3><p data-i18n="s2_p"></p></div>
    <div><b>3</b><h3 data-i18n="s3_t"></h3><p data-i18n="s3_p"></p></div>
  </div>

  <h2 data-i18n="shots_title">Screenshots</h2>
  <div class="shots">
    <img id="shot1" src="shots/en/01.webp" width="540" height="960" alt="">
    <img id="shot2" src="shots/en/02.webp" width="540" height="960" alt="">
  </div>

  <h2 data-i18n="feat_title">What's inside</h2>
  <ul class="features" id="features"></ul>

  <footer>
    <span>&copy; 2026 L.M.F.P.</span>
    <a id="privacy" href="privacy.html" data-i18n="privacy">Privacy policy</a>
    <a href="mailto:orbitaloverload.game@gmail.com" data-i18n="contact">Contact</a>
  </footer>
</div>

<script>
(function () {
  var T = {

      lead: "Saca las flechas del tablero en el orden correcto y júntalas de tres en tres por color antes de que se llene la bandeja. Un toque, una flecha: se entiende en segundos, pero pensar antes de tocar marca la diferencia.",
      how_title: "Cómo se juega",
      s1_t: "Toca una flecha", s1_p: "Si su camino hasta el borde está libre, sale disparada. Si choca con otra, rebota y pierdes una vida.",
      s2_t: "Junta tres iguales", s2_p: "Cada flecha que sale ocupa un hueco de la bandeja. Tres del mismo color desaparecen y dejan sitio.",
      s3_t: "No llenes la bandeja", s3_p: "Tienes siete huecos. Elige el orden con cabeza: si la bandeja se llena, se acabó el nivel.",
      shots_title: "Capturas", feat_title: "Qué trae",
      features: ["Cientos de niveles, todos con solución", "Pistas y deshacer", "Símbolos para daltónicos", "Sin conexión", "Sin cuentas", "Español, inglés, francés y alemán"],
      privacy: "Política de privacidad", contact: "Contacto"
    },
    en: {
      doc: "Flechazo: Arrow Jam Puzzle", tag: "Arrow Jam Puzzle", status: "In development · closed test very soon",
      lead: "Free the arrows from the board in the right order and match them in threes by colour before the tray fills up. One tap, one arrow: you get it in seconds, but thinking before you tap makes all the difference.",
      how_title: "How to play",

      s2_t: "Match three", s2_p: "Every arrow that leaves takes a slot in the tray. Three of the same colour vanish and free up space.",

    de: {

      lead: "Befreie die Pfeile in der richtigen Reihenfolge vom Spielfeld und sammle sie zu dritt nach Farbe, bevor die Ablage voll ist. Ein Tipp, ein Pfeil: In Sekunden verstanden, aber wer vorher nachdenkt, gewinnt.",

      privacy: "Datenschutzerklärung", contact: "Kontakt"
    }
  };
  var buttons = document.querySelectorAll("[data-set-lang]");
  function apply(lang) {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.doc;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.dataset.i18n]; });
    var list = document.getElementById("features");
    list.textContent = "";
    t.features.forEach(function (f) { var li = document.createElement("li"); li.textContent = f; list.appendChild(li); });
    document.getElementById("shot1").src = "shots/" + lang + "/01.webp";
    document.getElementById("shot2").src = "shots/" + lang + "/02.webp";
    document.getElementById("back").href = "../?lang=" + lang;
    document.getElementById("privacy").href = "privacy.html#" + lang;
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.setLang === lang); });
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      var lang = b.dataset.setLang;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      history.replaceState(null, "", "?lang=" + lang);
      apply(lang);
    });
  });
  apply(document.documentElement.lang);
})();
</script>
</body>
</html>
